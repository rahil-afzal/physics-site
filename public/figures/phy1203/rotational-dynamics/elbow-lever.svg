<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- upper arm (vertical) -->
  <rect x="75" y="20" width="30" height="130" rx="10" fill="#e8d3b9" stroke="#8a6d4b"/>
  <!-- forearm (horizontal) -->
  <rect x="90" y="135" width="440" height="30" rx="12" fill="#e8d3b9" stroke="#8a6d4b"/>
  <!-- elbow pivot -->
  <circle cx="90" cy="150" r="9" fill="#333"/>
  <text x="60" y="190" fill="#333">Elbow (pivot)</text>
  <!-- biceps force: 5 cm from elbow (x = 90 + 40) pulling up -->
  <line x1="130" y1="135" x2="130" y2="45" stroke="#c0392b" stroke-width="4" marker-end="url(#a)"/>
  <text x="140" y="60" fill="#c0392b">F</text>
  <text x="152" y="64" font-size="11" fill="#c0392b">biceps</text>
  <!-- load: 30 cm from elbow (x = 90 + 240) pulling down -->
  <line x1="330" y1="165" x2="330" y2="255" stroke="#1f5fa8" stroke-width="4" marker-end="url(#b)"/>
  <text x="340" y="245" fill="#1f5fa8">W (load) = 25 N</text>
  <!-- dimension lines -->
  <line x1="90" y1="110" x2="130" y2="110" stroke="#333"/>
  <text x="92" y="104" font-size="12" fill="#333">d = 0.05 m</text>
  <line x1="90" y1="215" x2="330" y2="215" stroke="#333"/>
  <line x1="90" y1="209" x2="90" y2="221" stroke="#333"/>
  <line x1="330" y1="209" x2="330" y2="221" stroke="#333"/>
  <text x="170" y="232" fill="#333">r = 0.30 m</text>
  <text x="380" y="40" fill="#333">Torque balance about the elbow:</text>
  <text x="380" y="62" fill="#333">F × 0.05 = 25 × 0.30  →  F = 150 N</text>
</svg>
